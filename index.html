<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf9">
  <meta name="description" content="ROZY.EG — إكسسوارات بنات فاخرة">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ROZY.EG — بوتيك الإكسسوارات الفاخرة</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js" defer></script>
</head>

<body>
  <div class="loader" id="loader" aria-label="جاري التحميل">
    <span class="loader-rose">✿</span>
    <b>ROZY.EG</b>
    <small>GIRLS ACCESSORIES · LUXURY BOUTIQUE</small>
  </div>

  <header>
    <a class="brand" href="#home" aria-label="ROZY.EG الصفحة الرئيسية">
      <span class="flower">❀</span>
      <span>ROZY.EG<small>GIRLS ACCESSORIES · LUXURY BOUTIQUE</small></span>
    </a>

    <nav aria-label="التنقل الرئيسي">
      <a href="#home" data-i="home">الرئيسية</a>
      <a href="#shop" data-i="shop">تسوقي</a>
      <a href="#story" data-i="story">قصتنا</a>
      <a href="#support" id="support-link" data-i="support" hidden>الدردشة والدعم الفني</a>
    </nav>

    <div class="tools">
      <button id="lang" type="button" aria-label="تغيير اللغة">EN</button>
      <button id="theme" type="button" aria-label="تفعيل الوضع الداكن" title="تغيير المظهر">
        <span id="theme-icon" aria-hidden="true">☾</span>
      </button>
      <a href="#cart" class="cart-link">
        <span aria-hidden="true">♡</span>
        <span data-i="cart">السلة</span>
        <b id="cart-count">0</b>
      </a>
      <a href="#account" id="account-link" data-i="login">دخول</a>
      <button id="install-app" type="button" hidden aria-label="تثبيت التطبيق">تثبيت</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer>
    <div class="footer-brand">
      <img src="assets/icon-192.png" alt="" width="42" height="42">
      <span class="footer-brand-copy">
        <strong>ROZY.EG</strong>
        <small data-i="footer">صُنعت بحب، وزُيّنت بالذهب الوردي.</small>
      </span>
    </div>
    <div class="footer-contact" id="store-social" aria-label="تواصل مع المتجر"></div>
    <div class="footer-credit">
      <span aria-hidden="true">©</span>
      <span data-i="rights">جميع الحقوق محفوظة لدى</span>
      <strong dir="ltr">R2J RAJEH WEB DEV</strong>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
